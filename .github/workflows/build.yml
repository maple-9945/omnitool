name: Build

# 触发条件：推送到主分支 / 开 PR / 手动触发
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的重复构建自动取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # libs/ 下三个 jar 被 .gitignore 忽略，CI 里必须先补回来。
      # 链接与 SHA-256 来自 libs/SOURCES.md；第一个文件在仓库里原名含 '#',
      # 存到本地必须重命名成 gregtech-1.12.2-master-2901.jar（RFG 的 deobf 不接受 '#'）。
      # ------------------------------------------------------------------
      - name: Download dev jars (GTCEu / GTLite Core / Morphism Lib)
        run: |
          set -euo pipefail
          mkdir -p libs
          BASE="https://raw.githubusercontent.com/GregTechLite/GregTech-Lite-Modpack/main/mods"

          echo "==> GTCEu master #2901"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/gregtech-1.12.2-master-2901.jar" \
            "$BASE/gregtech-1.12.2-master-%232901.jar"

          echo "==> GregTech Lite Core 1.0.0"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/gtlitecore-1.0.0.jar" \
            "$BASE/gtlitecore-1.0.0.jar"

          echo "==> Morphism Lib 1.0.0"
          curl -fsSL --retry 5 --retry-delay 3 \
            -o "libs/morphismlib-1.12.2-1.0.0.jar" \
            "$BASE/morphismlib-1.12.2-1.0.0.jar"

          # 校验：
          #  - GTCEu 严格校验（GTLite Core 依赖 #2901 的 API，GT 版本不对会直接编译/加载失败）
          #  - gtlitecore / morphismlib 上游会就地替换同名 jar（1.0.0 内容更新过），
          #    硬编码哈希会导致 CI 无故失败，这里只做 zip 完整性校验 + 哈希变化提示
          cd libs
          printf '%s  %s\n' \
            "b9fea8ac4599f04348c12611e515d43dc15819a9b11df9bfbc1495e7e123b317" "gregtech-1.12.2-master-2901.jar" \
            > /tmp/gtce.sha256
          sha256sum -c /tmp/gtce.sha256

          for j in gtlitecore-1.0.0.jar morphismlib-1.12.2-1.0.0.jar; do
            unzip -tq "$j"
            actual="$(sha256sum "$j" | cut -d' ' -f1)"
            case "$j" in
              gtlitecore-1.0.0.jar) expected="a41618aa2397c1a268e59a619b58faba610ff0e0d485f289a2ffeb763c604337" ;;
              *) expected="39e6271853929d13a73e62dea72bb13392bf3c35734b37d518fc5d98bba3b233" ;;
            esac
            if [ "$actual" != "$expected" ]; then
              echo "::warning file=libs/SOURCES.md::上游 $j 哈希已变化（$actual），请同步更新 libs/SOURCES.md"
            else
              echo "OK $j sha256=$actual"
            fi
          done

          # 再确认都是完整 zip，避免下游 "End-of-central-directory" 之类的神秘报错
          for j in *.jar; do unzip -tq "$j"; done
          ls -la

      # ------------------------------------------------------------------
      # Gradle 9.7.0 需要 JDK >= 17 才能跑；编译级别仍是 Java 8，
      # 由 build.gradle 里的 toolchain 通过 foojay 自动下载 Zulu 8（applyJST 另需 Zulu 21）。
      # ------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # gradle.properties 里那行 org.gradle.java.home=D:/study/java/jdk25 是本机路径，
      # Linux runner 上不存在会让 Gradle 直接失败，这里删掉（配合下面的 GRADLE_OPTS 双保险）。
      - name: Remove local org.gradle.java.home from gradle.properties
        run: |
          sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' gradle.properties
          grep -n "org.gradle" gradle.properties || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          # 用 setup-java 提供的 JDK 25 覆盖 daemon JVM（系统属性优先级高于 gradle.properties）
          export GRADLE_OPTS="-Dorg.gradle.java.home=${JAVA_HOME} ${GRADLE_OPTS:-}"
          # 不加 --no-daemon：让 gradle.properties 里的 org.gradle.jvmargs=-Xmx3G 生效
          ./gradlew build --stacktrace

      - name: List built artifacts
        if: always()
        run: ls -la build/libs || true

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: omnitool-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14